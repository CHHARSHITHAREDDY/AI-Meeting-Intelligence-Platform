<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cue Intelligence</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #0d0e15;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #6366F1, #EC4899);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }
    .title {
      font-size: 15px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 10px;
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366F1, #EC4899);
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.35);
      transition: transform 0.15s ease;
    }
    .btn:hover {
      transform: scale(1.02);
    }
    .btn-secondary {
      background: #181b25;
      color: #c7c4d7;
      border: 1px solid #232b45;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✦</div>
    <div>
      <div class="title">Cue Intelligence</div>
      <div class="subtitle">Floating Meeting Assistant</div>
    </div>
  </div>

  <button id="toggleOverlay" class="btn">
    ✦ Inject Floating Widget on Tab
  </button>
  
  <button id="openDashboard" class="btn btn-secondary">
    Open Web Dashboard ↗
  </button>

  <script src="popup.js"></script>
</body>
</html>
