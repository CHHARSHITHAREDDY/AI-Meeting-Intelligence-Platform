<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weave AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      padding: 20px;
      background: #0B0F19;
      color: #f5e2de;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6a2153, #5DE6FF);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.4);
    }
    .title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #f5e2de;
    }
    .subtitle {
      font-size: 11px;
      color: #5DE6FF;
      font-family: monospace;
      margin-top: 1px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6a2153, #6a2153);
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }
    .btn-secondary {
      background: #1d3a4d;
      color: #C7C4D7;
      border: 1px solid #2a4a5e;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #1a3345;
      color: #f5e2de;
    }
    .status-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(18, 23, 42, 0.8);
      border: 1px solid #2a4a5e;
      border-radius: 10px;
      font-size: 11px;
      font-family: monospace;
      color: #9f8f99;
      margin-bottom: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 8px #34D399;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      color: #94A3B8;
      font-size: 10px;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #232B45;
    }
    .join-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .join-row {
      display: flex;
      gap: 6px;
    }
    .join-input {
      flex: 1;
      min-width: 0;
      background: #12172A;
      border: 1px solid #232B45;
      color: #F8FAFC;
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      outline: none;
      font-family: inherit;
    }
    .join-input:focus { border-color: #6366F1; }
    .join-input::placeholder { color: #6b7280; }
    .btn-join {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366F1, #06B6D4);
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-join:hover { opacity: 0.9; }
    .join-hint {
      font-size: 10.5px;
      color: #94A3B8;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✦</div>
    <div>
      <div class="title">Weave</div>
      <div class="subtitle">AI Meeting Assistant</div>
    </div>
  </div>

  <div class="status-badge">
    <span style="display:flex; align-items:center; gap:6px;">
      <span class="dot"></span> Stream Status
    </span>
    <span style="color:#34D399; font-weight:bold;">Ready</span>
  </div>

  <div class="join-section">
    <div class="join-row">
      <input id="meetLinkInput" type="text" class="join-input" placeholder="Paste Google Meet / Zoom / Teams link..." />
      <button id="joinMeetingBtn" class="btn-join">Join</button>
    </div>
    <p class="join-hint">Opens the link in a new tab and arms the assistant. Ask to join as usual — once the host admits you, just hit ▶ Start to capture the meeting.</p>
  </div>

  <div class="divider">or</div>

  <div class="actions">
    <button id="toggleOverlay" class="btn">
      <span>✦ Inject Floating Widget on Tab</span>
    </button>

    <button id="openDashboard" class="btn btn-secondary">
      <span>Open Weave Dashboard ↗</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
