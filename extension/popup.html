<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cue Intelligence</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 20px;
      background-color: #0d0e15;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      items-center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366F1, #EC4899);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #c0c1ff;
      color: #0d0096;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 0 15px rgba(192, 193, 255, 0.4);
      transition: transform 0.15s ease;
    }
    .btn:hover {
      transform: scale(1.02);
    }
    .btn-secondary {
      background: #181b25;
      color: #c7c4d7;
      border: 1px solid #232b45;
      box-shadow: none;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✦</div>
    <div>
      <div class="title">Cue Intelligence</div>
      <div class="subtitle">Real-time Audio & Meeting AI</div>
    </div>
  </div>

  <div class="status">
    <span class="dot"></span>
    Backend Ready on localhost:3000
  </div>

  <button id="openSidePanel" class="btn" style="margin-top: 16px;">
    Open Side Panel Assistant
  </button>
  
  <button id="openDashboard" class="btn btn-secondary" style="margin-top: 8px;">
    Open Full Dashboard
  </button>

  <script src="popup.js"></script>
</body>
</html>
